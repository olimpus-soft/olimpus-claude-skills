  # ── Escaneo de contenedor ─────────────────────────────────────────────────
  trivy:
    name: Trivy — Container Security Scan
    runs-on: [self-hosted, linux, x64, vps-ephemeral]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t app-scan:${{ github.sha }} .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app-scan:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
